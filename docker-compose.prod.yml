version: '3.8'

# Canonical compose template (tracked in git).
# Copy this file for local/production edits — docker-compose.yml is gitignored:
#   cp docker-compose.prod.yml docker-compose.yml
# Then edit docker-compose.yml (ports, binds, extra services).
#
# Notes:
# - The relay image is built locally from this repository. There is deliberately
#   no `image:` name pointing at a registry: with `build:` and no `image:`,
#   Compose always builds (or reuses the local image) and never tries to pull.
# - The Tor service provides a hidden service for the relay
# - The tor_data volume persists onion keys so the .onion address remains stable across restarts.

services:
  relay:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Container listens internally on 3337 (ADDR)
      ADDR: ":3337"
      # Goroutine stacktrace dump (up to ~2 MB/event) is a debug aid only;
      # it is the main source of container log growth. Default off in prod.
      # Set GOROUTINE_DUMP=auto to follow VERBOSE, or =on to force the dump.
      GOROUTINE_DUMP: "${GOROUTINE_DUMP:-off}"
      # Goroutine limits: YELLOW only warns, RED fails /api/v1/health with 503
      # so the Docker healthcheck fails and autoheal restarts the container.
      # Keep the leak bounded without restarting on normal 2h refresh spikes.
      GOROUTINE_WARN_THRESHOLD: "30000"
      GOROUTINE_FAIL_THRESHOLD: "50000"
      # Self-referencing relay removed on purpose: wot.girino.org is served by
      # this same VPS, so dialing it through Cloudflare loops back into our own
      # nginx and trips wot-relay's per-IP connection limit (HTTP 429), which
      # the broadcaster then retries forever. nostr.girino.org is a different
      # relay and stays. The stale values in .env are overridden here.
      QUERY_REMOTES: "wss://nostr.girino.org,wss://relay.damus.io,wss://relay.primal.net,wss://pyramid.fiatjaf.com/,wss://theforest.nostr1.com/,wss://relays.land/spatianostra,wss://noornode.nostr1.com/,wss://primus.nostr1.com/,wss://relay.nostr.moe/,wss://news.utxo.one/,wss://relay.stream/,wss://nos.lol/,wss://nostr.mom/,wss://nostr.wine/,wss://yabu.me"
      BROADCAST_MANDATORY_RELAYS: "wss://nostr.girino.org,wss://haven.girino.org/outbox,wss://haven.girino.org/inbox,wss://haven.girino.org/chat,wss://haven.girino.org/private,wss://relay.primal.net,wss://nos.lol"
    ports:
      - "${COMPOSE_RELAY_PORT:-3337}:3337" # host:container
    labels:
      - "saint-michaels-mirror.autoheal=true"
    networks:
      - proxy_net
    healthcheck:
      # -f: fail on HTTP 4xx/5xx (RED health returns 503)
      # -sS: silent progress, still print errors (stored in docker health log)
      # --max-time: stay under the Docker timeout so a hung probe is visible
      test: ["CMD", "curl", "-fsS", "--max-time", "8", "http://localhost:3337/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      # Broadcast discovery + batch health of thousands of relays can take ~5 min
      start_period: 600s
    logging:
      # Without this, json-file grows unbounded (observed: 34G json.log).
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  tor:
    # Tor hidden service image
    image: goldy/tor-hidden-service:latest
    restart: unless-stopped
    # Environment variables for Tor configuration
    environment:
      # Hidden service configuration
      # Syntax: {SERVICE}_TOR_SERVICE_HOSTS=port:target:targetport
      - RELAY_TOR_SERVICE_HOSTS=80:relay:3337
      - RELAY_TOR_SERVICE_VERSION=3
      # Enable SOCKS proxy for health check
      - TOR_SOCKS_PORT=9050
    volumes:
      # Persist Tor hidden service keys
      - tor_data:/var/lib/tor/hidden_service/
    labels:
      - "saint-michaels-mirror.autoheal=true"
    networks:
      - proxy_net
    healthcheck:
      # Test Tor connectivity by checking Tor Project API
      # 1. Hidden service hostname file exists
      # 2. Test actual Tor connectivity using torsocks + wget
      # Timeouts here usually mean circuit congestion; autoheal restart recovers.
      test: ["CMD", "sh", "-c", "test -f /var/lib/tor/hidden_service/relay/hostname && torsocks wget -q -O - https://check.torproject.org/api/ip | grep -q '\"IsTor\":true'"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"

  autoheal:
    image: willfarrell/autoheal:latest
    restart: unless-stopped
    container_name: saint-michaels-mirror-autoheal
    environment:
      # Only containers in this compose (label below). Not host-wide `all`.
      - AUTOHEAL_CONTAINER_LABEL=saint-michaels-mirror.autoheal
      - AUTOHEAL_INTERVAL=30
      # Posted when autoheal restarts a container; set in .env (empty disables)
      - WEBHOOK_URL=${WEBHOOK_URL:-}
      # Extra Discord/log dump of healthcheck output + recent container logs
      - POST_RESTART_SCRIPT=/scripts/notify-restart.sh
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/notify-restart.sh:/scripts/notify-restart.sh:ro
    networks:
      - proxy_net
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  tor_data:

networks:
  proxy_net:
    driver: bridge
